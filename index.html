t{position:fixed;right:22px;bottom:22px;z-index:50;max-width:420px;padding:13px 18px;border-radius:10px;background:#13495a;color:#fff;box-shadow:0 10px 35px #0003;font-size:13px;line-height:1.7}.toast.error{background:#ae4c51}.preview-alert{background:#fff0d9;padding:7px 15px;font-size:12px;color:#8b5d22;text-align:center}.demo-bar{display:flex;gap:8px;align-items:center;background:#fff9e9;border:1px solid #eedbb6;padding:10px 15px;border-radius:10px;font-size:11px;color:#896929;margin-bottom:21px;flex-wrap:wrap}.demo-bar select{font-size:12px;padding:5px 8px;border:1px solid #ddc9a6;border-radius:7px;background:#fff}.loader{padding:100px 30px;text-align:center;color:#678390}.spinner{margin:0 auto 17px;width:34px;height:34px;border:3px solid #d3e5e5;border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1170px){.dashboard-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.detail-layout{grid-template-columns:1fr}.detail-aside{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:800px){.app{display:block}.side{position:static;width:100%;height:auto}.brand{padding:12px 18px}.snav{display:flex;gap:6px;overflow-x:auto;padding:7px 10px}.nav-label,.side-foot{display:none}.nav-btn{width:auto;min-width:116px;padding:10px;font-size:12px;flex-shrink:0}.topbar{height:auto;min-height:76px;padding:16px;flex-wrap:wrap}.main{padding:22px 15px 60px}.page-head{align-items:start}.page-title{font-size:23px}.stats{gap:10px}.stat{padding:15px}.stat .value{font-size:29px}.detail-aside{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.checkbox-grid{grid-template-columns:1fr}.form-card{padding:18px}.snapshot{justify-content:center}}
.reference-tip{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#f7fbfc}.ref-button{border:0;cursor:pointer}
.codepill{display:inline-block;min-width:48px;text-align:center;padding:5px 9px;border-radius:8px;font-size:11.5px;letter-spacing:.15px;line-height:1.4;color:#fff;background:#8395a1;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.codepill.report-MG{background:#4E79A7;color:#fff}.codepill.report-EP{background:#59A14F;color:#fff}.codepill.report-RT{background:#F19BA8;color:#3b232b}.codepill.report-PC{background:#EBC54D;color:#493c15}.codepill.report-LEG{background:#E6EAF0;color:#526373;border:1px solid #b8c3cc}
.report-legend{display:flex;align-items:center;flex-wrap:wrap;gap:7px 16px;padding:10px 22px;background:#fbfcfd;border-bottom:1px solid var(--line);font-size:11px;color:#70838c}
.report-legend .legend-item{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.report-legend .legend-swatch{width:10px;height:10px;display:inline-block;border-radius:3px}
.chapter-line .facet-label{display:flex;align-items:center;gap:8px}.chapter-line .facet-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}

<body><div id="app"><div class="loader"><div class="spinner"></div>正在載入永續報告書填報系統...</div></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const DEMO = !(window.google && google.script && google.script.run);
const STATUSES={none:'未填報',draft:'填報中',completed:'已鎖定'};
const ROLES={admin:'系統管理者',editor:'單位填報者',viewer:'單位檢視者'};
const FIELDS=['summary','goal','actions','kpis','goal_status','changes','plans','contact'];
const S={authToken:(()=>{try{return sessionStorage.getItem('nkust_tracker_token_v4')||'';}catch(e){return '';}})(),loginStep:'email',loginEmail:'',boot:null,year:'2026',view:'dashboard',filter:'all',chapter:'all',query:'',detail:null,modal:null,busy:false,autosave:null,dirty:false,demoUnit:'U01',demoRole:'admin',lastResult:null};
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const z=new URL(u);return z.protocol==='https:'?z.href:'#'}catch(_){return '#'}};
const status=s=>'<span class="status '+esc(s||'none')+'">'+esc(STATUSES[s||'none']||s)+'</span>';
const roles=()=>S.boot?S.boot.me.role:'viewer';
const admin=()=>roles()==='admin';
const sections=()=>S.boot.sections;
const units=()=>S.boot.units;
const uName=id=>(units().find(x=>x.unit_id===id)||{}).name||id;
const sec=id=>sections().find(x=>x.section_id===id)||{section_id:id,section_title:id,chapter_title:''};
// 114 年互動關係人調查報告「表 1 永續議題編碼對照表」；G01 為附錄 A 的 112 年舊編碼。
const REPORT_FACETS=[
 {id:'MG',label:'經營管理',color:'#4E79A7'},
 {id:'EP',label:'環境保護',color:'#59A14F'},
 {id:'RT',label:'研究教學',color:'#F19BA8'},
 {id:'PC',label:'鏈結合作',color:'#EBC54D'},
 {id:'LEG',label:'112 年沿用',color:'#8B97A2'}
];
// 僅改畫面顯示代碼；後端識別碼 M01–M12 保留，以免破壞歷年資料關聯。
const REPORT_CODES={M01:'EP8',M02:'RT2',M03:'RT4',M04:'RT1',M05:'MG7',M06:'PC2',M07:'MG9',M08:'EP5',M09:'MG8',M10:'G01',M11:'PC3',M12:'MG1'};
const reportCode=s=>REPORT_CODES[s.section_id]||s.section_id;
const reportFacet=s=>{const code=reportCode(s);if(code==='G01')return 'LEG';return REPORT_FACETS.find(f=>code.startsWith(f.id))?.id||'LEG';};
const reportFacetInfo=s=>REPORT_FACETS.find(f=>f.id===reportFacet(s))||REPORT_FACETS[4];
const reportCodeChip=s=>{const c=reportCode(s),f=reportFacet(s),title=f==='LEG'&&c==='G01'?'沿用 112 年 G01 編碼；114 年調查 25 項議題未包含「校務治理」':reportFacetInfo(s).label+' / '+c;return '<span class="codepill report-'+f+'" title="'+esc(title)+'">'+esc(c)+'</span>';};
const reportFacetLabel=s=>{const f=reportFacetInfo(s);return f.id==='LEG'?'沿用 112 年議題':f.label;};

function toast(message,isErr=false){$('toastRoot').innerHTML='<div class="toast '+(isErr?'error':'')+'">'+esc(message)+'</div>';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>$('toastRoot').innerHTML='',4500);}
function serverCall(name,arg){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message?err.message:String(err)))); runner[name](arg);});}
function api(name,arg={}){return DEMO?demoCall(name,arg):serverCall(name,{...arg,token:S.authToken});}
async function refresh(keepDetail=false){const b=await api('getBootstrap');S.boot=b;if(!b.years.includes(S.year))S.year=b.years[0]||'2026'; if(!keepDetail)S.detail=null;render();}
function renderLogin(error=''){
 const enter=S.loginStep==='email';
 $('app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#e8f5f3,#f5f8fa)"><div class="card pad" style="width:min(470px,100%)"><div class="eyebrow">NKUST · MATERIAL TOPICS</div><h1 style="font-size:24px;margin:12px 0">重大永續議題年度追蹤</h1><p class="page-subtitle">使用經管理者授權的辦公室群組信箱，取得一次性驗證碼。無需 GitHub 帳號。</p>${error?`<div class="inline-alert" style="margin:16px 0">${esc(error)}</div>`:''}${enter?`<div class="field" style="margin-top:24px"><label class="form-label">辦公室公務 Email</label><input id="loginEmail" type="email" class="input" autocomplete="email" placeholder="office@nkust.edu.tw" value="${esc(S.loginEmail)}"></div><button class="btn primary" data-action="sendLoginCode" style="width:100%">寄送驗證碼</button>`:`<div class="field" style="margin-top:24px"><label class="form-label">驗證碼已寄至</label><div class="mini-note">${esc(S.loginEmail)}</div><label class="form-label" style="margin-top:18px">6 位數驗證碼（10 分鐘內有效）</label><input id="loginCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" class="input" placeholder="請輸入 6 位驗證碼"></div><div class="btnrow"><button class="btn" data-action="backLogin">更換信箱</button><button class="btn primary" data-action="confirmLogin" style="flex:1">驗證並進入系統</button></div>`}<p class="form-hint" style="margin-top:18px">信箱為單位授權收件地址；能收取群組信箱的人都可能代表單位操作。請勿將驗證碼轉寄給非授權人員。</p></div></div>`;
}
async function start(){if(DEMO){await refresh();return;}if(!S.authToken){renderLogin();return;}try{await refresh();}catch(e){S.authToken='';try{sessionStorage.removeItem('nkust_tracker_token_v4');}catch(_){}renderLogin(e.message);}}
async function sendLoginCode(){const email=String(($('loginEmail')||{}).value||'').trim().toLowerCase();if(!email){renderLogin('請輸入辦公室公務信箱。');return;}S.loginEmail=email;try{await api('requestEmailCode',{purpose:'login',email});S.loginStep='code';renderLogin();}catch(e){renderLogin(e.message);}}
async function confirmLogin(){const code=String(($('loginCode')||{}).value||'').trim();try{const result=await api('verifyLoginCode',{email:S.loginEmail,code});S.authToken=result.token;try{sessionStorage.setItem('nkust_tracker_token_v4',result.token);}catch(_){}await refresh();}catch(e){S.loginStep='code';renderLogin(e.message);}}
async function logOut(){if(!DEMO)try{await api('logoutSession');}catch(e){} S.authToken='';S.boot=null;S.loginStep='email';S.loginEmail='';try{sessionStorage.removeItem('nkust_tracker_token_v4');}catch(_){}renderLogin();}

const listTasks=()=>S.boot.assignments.filter(a=>a.year===S.year).map(a=>{const e=S.boot.entries.find(x=>x.year===S.year&&x.section_id===a.section_id&&x.unit_id===a.unit_id);return {...a,section:sec(a.section_id),entry:e||null,status:e?e.status:'none'};}).sort((a,b)=>Number(a.section.sort)-Number(b.section.sort));
const allTasks=()=>listTasks().filter(t=>{
 if(S.filter!=='all'&&t.status!==S.filter)return false;
 if(S.chapter!=='all'&&reportFacet(t.section)!==S.chapter)return false;
 const text=[t.section_id,reportCode(t.section),reportFacetLabel(t.section),t.section.section_title,t.section.chapter_title,uName(t.unit_id)].join(' ').toLowerCase();
 return text.includes(S.query.toLowerCase());
});
function counts(tasks){return {total:tasks.length,completed:tasks.filter(t=>t.status==='completed').length,draft:tasks.filter(t=>t.status==='draft').length,none:tasks.filter(t=>t.status==='none').length};}
function isLate(task){return !!task.due_date&&new Date(task.due_date+'T23:59:59')<new Date()&&task.status!=='completed';}
function navButton(view,sym,text){return '<button type="button" class="nav-btn '+(S.view===view?'active':'')+'" data-view="'+view+'"><span class="sym">'+sym+'</span>'+text+'</button>';}
function demoTools(){return DEMO?'<div class="demo-bar"><b>互動預覽</b>｜此頁在本機使用模擬資料，不具真實身分驗證或權限保護。 <label>切換身份：<select id="demoIdentity"><option value="admin" '+(S.demoRole==='admin'?'selected':'')+'>管理者</option><option value="editor" '+(S.demoRole==='editor'?'selected':'')+'>單位填報者</option><option value="viewer" '+(S.demoRole==='viewer'?'selected':'')+'>單位檢視者</option></select></label><label>單位：<select id="demoUnit">'+units().map(u=>'<option value="'+esc(u.unit_id)+'" '+(S.demoUnit===u.unit_id?'selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select></label></div>':'';}
function render(){
 if(!S.boot)return;
 const me=S.boot.me;
 const pageLabels={dashboard:'追蹤總覽',tasks:admin()?'全部追蹤任務':'我的追蹤任務',assign:'議題與權責指派',users:'公務信箱授權',report:'重大議題追蹤彙整',reference:'參考報告書',export:'資料下載',detail:'議題追蹤填報'};
 if(!admin()&&['assign','users','report'].includes(S.view))S.view='dashboard';
 let content='';
 if(S.view==='dashboard')content=pageHeader('重大永續議題追蹤總覽','以年度重大議題與負責單位掌握資料更新及完成進度。', '<button class="btn primary" data-action="downloadData">下載'+(admin()?'全校':'本單位')+' CSV</button>')+dashboard();
 else if(S.view==='tasks')content=pageHeader(admin()?'全部追蹤任務':'我的追蹤任務',admin()?'可查看各單位資料；填報權限由後端判斷。':'只顯示本單位獲指派的年度重大議題。')+taskTable(true);
 else if(S.view==='assign')content=pageHeader('重大議題與單位指派','同一重大議題可由多個單位分別追蹤與更新。')+assignmentsView();
 else if(S.view==='users')content=pageHeader('公務信箱授權','每單位授權一個收取驗證碼的填報群組信箱，唯讀群組信箱可選填。')+usersView();
 else if(S.view==='report')content=pageHeader('重大議題追蹤彙整','依重大議題與單位順序產出 Google 文件 / PDF。')+reportView();
 else if(S.view==='reference')content=pageHeader('參考報告書','管理者可上傳 PDF，所有已授權單位可檢視及下載。')+referenceView();
 else if(S.view==='export')content=pageHeader('年度資料下載','依登入權限匯出全校或本單位的完整重大議題追蹤內容。')+exportView();
 else if(S.view==='detail')content=detailView();
 $('app').innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="logo">N<br>K</div><div><strong>重大永續議題<br>年度追蹤平台</strong><small>NKUST · MATERIAL TOPICS</small></div></div><nav class="snav"><div class="nav-label">工作空間 / WORKSPACE</div>'+navButton('dashboard','▦','追蹤總覽')+navButton('tasks','▤',admin()?'全部追蹤':'我的追蹤')+navButton('reference','▣','參考報告書 PDF')+navButton('export','⇩','資料下載')+(admin()?'<div class="nav-label" style="margin-top:27px">管理控制 / ADMIN</div>'+navButton('assign','☷','重大議題指派')+navButton('users','♙','公務信箱授權')+navButton('report','▣','產生追蹤彙整稿'):'')+'</nav><div class="side-foot">國立高雄科技大學<br>重大永續議題追蹤平台 v4.2<br>以原報告書 12 項重大議題為基礎</div></aside><div class="workspace"><header class="topbar"><div class="top-left"><small>重大永續議題 / '+esc(S.year)+' TRACKING CYCLE</small><h1>'+esc(pageLabels[S.view]||'追蹤平台')+'</h1></div><div class="top-actions"><select class="year-choice" id="yearChooser" aria-label="填報年度">'+S.boot.years.map(y=>'<option value="'+esc(y)+'" '+(y===S.year?'selected':'')+'>'+esc(y)+' 年度</option>').join('')+'</select><button class="btn sm soft" data-view="reference">參考 PDF</button><div class="top-user">'+esc(me.name||me.email)+' · '+esc(ROLES[me.role]||me.role)+(me.account_type==='office'||me.account_type==='office_viewer'?' · 公務信箱':'')+'</div>'+(DEMO?'':'<button class="btn sm" data-action="logout">登出</button>')+'</div></header><main class="main">'+demoTools()+content+'</main></div></div>';
 renderModal();
}
function pageHeader(title,subtitle,extra=''){return '<div class="page-head"><div><div class="eyebrow">MATERIAL TOPICS TRACKING / '+esc(S.year)+'</div><h2 class="page-title">'+esc(title)+'</h2><p class="page-subtitle">'+esc(subtitle)+'</p></div><div class="btnrow">'+extra+'</div></div>';}
function dashboard(){
 const ts=listTasks(),n=counts(ts),over=ts.filter(isLate).length,rate=n.total?Math.round(n.completed/n.total*100):0;
 const bars=REPORT_FACETS.map(f=>{const rows=ts.filter(t=>reportFacet(t.section)===f.id),pct=rows.length?Math.round(rows.filter(t=>t.status==='completed').length/rows.length*100):0;return rows.length?'<div class="chapter-line"><span class="facet-label"><i class="facet-dot" style="background:'+f.color+'"></i>'+esc(f.label)+'</span><div class="progress"><span style="width:'+pct+'%;background:'+f.color+'"></span></div><span class="pct">'+pct+'%</span></div>':'';}).join('');
 return `<div class="stats"><div class="card stat accent"><div class="small">已指派追蹤任務</div><div class="value">${n.total}<em>筆</em></div><div class="detail">12 項重大議題，可由多單位分工</div></div><div class="card stat waiting"><div class="small">填報中</div><div class="value">${n.draft}<em>筆</em></div><div class="detail">未鎖定前可編輯</div></div><div class="card stat approved"><div class="small">已鎖定</div><div class="value">${n.completed}<em>筆</em></div><div class="detail">鎖定完成率 ${rate}%</div></div><div class="card stat overdue"><div class="small">逾期未完成</div><div class="value">${over}<em>筆</em></div><div class="detail">依指派的截止日計算</div></div></div><div class="dashboard-grid"><div class="card pad"><div class="section-head"><h3>各調查面向完成進度</h3><small>依單位追蹤任務計算</small></div>${bars}</div><div class="card pad"><div class="section-head"><h3>本年度追蹤概況</h3><small>共 ${n.total} 筆</small></div><div class="snapshot"><div class="ringwrap"><div class="ring" style="background:conic-gradient(#178c85 ${rate}%,#e9f0f2 ${rate}% 100%)"></div><div class="ringcenter"><strong>${rate}%</strong><small>已鎖定</small></div></div><div class="ringdetail"><div><i class="dot green"></i>已鎖定 ${n.completed}</div><div><i class="dot blue"></i>填報中 ${n.draft}</div><div><i class="dot"></i>未填報 ${n.none}</div></div></div><div class="mini-note" style="margin-top:20px">不設審核流程。各單位「儲存並鎖定」即完成填報；要再修改，需使用公務信箱驗證碼重新解鎖。</div></div></div>`+taskTable(false);
}
function taskTable(full,forceStatus){const ts=(full?allTasks():listTasks().slice(0,9)).filter(t=>!forceStatus||t.status===forceStatus);const controls=full?'<div class="filter-group"><select id="statusFilter" class="select" style="width:135px"><option value="all">全部狀態</option>'+Object.keys(STATUSES).map(k=>'<option value="'+k+'" '+(S.filter===k?'selected':'')+'>'+STATUSES[k]+'</option>').join('')+'</select><select id="chapterFilter" class="select" style="width:170px"><option value="all">全部調查面向</option>'+REPORT_FACETS.map(f=>'<option value="'+f.id+'" '+(S.chapter===f.id?'selected':'')+'>'+esc(f.label)+'</option>').join('')+'</select><input id="taskQuery" class="input search" placeholder="搜尋議題或單位" value="'+esc(S.query)+'"></div>':'<button class="btn sm" data-view="tasks">檢視全部任務</button>';let body=ts.map(t=>'<tr><td>'+reportCodeChip(t.section)+'</td><td><strong>'+esc(t.section.section_title)+'</strong><div class="smallgrey">'+esc(reportFacetLabel(t.section))+'</div></td><td>'+esc(uName(t.unit_id))+'</td><td>'+status(t.status)+'</td><td><span class="due '+(isLate(t)?'late':'')+'">'+esc(t.due_date||'未設定')+'</span></td><td>'+esc(t.entry&&t.entry.updated_at||'尚無更新')+'</td><td><button class="btn sm soft" data-action="openTask" data-sec="'+esc(t.section_id)+'" data-unit="'+esc(t.unit_id)+'">'+(roles()==='viewer'?'檢視':'開啟')+'</button></td></tr>').join('');const legend='<div class="report-legend">'+REPORT_FACETS.map(f=>'<span class="legend-item"><i class="legend-swatch" style="background:'+f.color+'"></i>'+esc(f.id==='LEG'?'112 年沿用':f.id+' '+f.label)+'</span>').join('')+'</div>';return '<div class="card table-card"><div class="filters"><h3>'+(full?'年度追蹤清單':'最近工作項目')+'</h3>'+controls+'</div>'+legend+'<div class="table-scroll"><table class="data"><thead><tr><th>編號</th><th>追蹤議題</th><th>負責單位</th><th>目前狀態</th><th>截止日期</th><th>最近更新</th><th>操作</th></tr></thead><tbody>'+ (body||'<tr><td colspan="7"><div class="empty-hint">目前沒有符合條件的資料。</div></td></tr>')+'</tbody></table></div></div>';}
function detailView(){
 if(!S.detail)return '<div class="loader">載入議題中...</div>';
 const d=S.detail,a=d.assignment,e=d.entry||{},canWrite=d.canEdit;
 const fields=[['summary','政策 / 承諾 / 管理方針','說明既有政策與管理作法。',false],['goal','本年度追蹤目標','請提供可衡量的短/中/長期目標。',true],['actions','本年度執行情形','填報推動措施、進度與具體成果。',true],['kpis','績效指標 / 量化數據','每行使用「指標名稱 | 本期數值 | 單位 | 前期數值」格式。',true],['goal_status','目標達成狀態','依實際成果選擇。',false],['changes','與前期比較 / 改善措施','說明重要變動、未達成原因與改善方案。',true],['plans','下一年度追蹤事項','請寫後續事項、責任與預定時程。',true],['contact','單位窗口（公務信箱）','請以公務信箱為主。',false]];
 const form=fields.map(([k,label,hint,long])=>`<div class="field"><label class="form-label" for="f_${k}">${label}</label><div class="form-hint">${hint}</div>${k==='goal_status'?'<select class="select" id="f_goal_status" data-autosave '+(canWrite?'':'disabled')+'>'+['','尚未開始','進行中','已達成','部分達成','未達成','不適用'].map(v=>'<option value="'+esc(v)+'" '+((e.goal_status||'')===v?'selected':'')+'>'+(v||'請選擇')+'</option>').join('')+'</select>':k==='contact'?'<input class="input" id="f_'+k+'" data-autosave value="'+esc(e[k]||'')+'" '+(canWrite?'':'disabled')+'>':'<textarea class="textarea '+(long?'long':'')+'" id="f_'+k+'" data-autosave '+(canWrite?'':'disabled')+'>'+esc(e[k]||'')+'</textarea>'}</div>`).join('');
 const actions=canWrite?`<div class="save-bar"><span id="saveState" class="save-state">${e.updated_at?'最後儲存：'+esc(e.updated_at):'填寫中會自動儲存草稿'}</span><div class="btnrow"><button class="btn" data-action="saveDraft">儲存更新</button><button class="btn primary" data-action="markComplete">儲存並鎖定</button></div></div>` :d.canUnlock?'<div class="inline-alert">🔒 本項資料已儲存並鎖定，無法直接修改。若需更新，請取得公務信箱一次性解鎖碼。</div><button class="btn primary" data-action="requestUnlock">申請解鎖</button>':'<div class="inline-alert">目前為唯讀檢視權限。可查看或下載本單位已指派議題，但不能修改內容。</div>';
 const previous=d.previous?`<div class="card side-info"><h4>前一期追蹤參考 · ${esc(d.previous.year)}</h4><div class="info-text">${esc((d.previous.summary||d.previous.actions||'前期沒有紀錄').slice(0,700))}</div></div>`:'';
 const history=`<div class="card side-info"><h4>更新紀錄</h4>${d.history.length?d.history.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b style="font-size:11px">${esc(x.action)}</b><div class="smallgrey">${esc(x.at)} · ${esc(x.actor)}</div></div>`).join(''):'<div class="info-text">尚無紀錄</div>'}</div>`;
 return pageHeader(a.section_title,reportCode(a)+' / '+reportFacetLabel(a)+' / '+a.unit_name,'<button class="btn" data-view="tasks">返回清單</button>')+`<div class="detail-layout"><div class="card form-card"><div class="section-head"><h3>年度追蹤內容</h3>${status(e.status||'none')}</div><p class="page-subtitle" style="margin-bottom:25px">僅需更新本年度重大議題推動情形，不必填寫整份永續報告書。</p>${form}${actions}</div><aside class="detail-aside"><div class="card side-info"><h4>追蹤資訊</h4><div class="meta-line"><span>議題代碼</span><span>${reportCodeChip(a)}</span></div><div class="meta-line"><span>單位</span><span>${esc(a.unit_name)}</span></div><div class="meta-line"><span>年度</span><span>${esc(S.year)}</span></div><div class="meta-line"><span>截止日</span><span>${esc(a.due_date||'未設定')}</span></div><div class="meta-line"><span>狀態</span><span>${status(e.status||'none')}</span></div><div class="meta-line"><span>版本</span><span>V${esc(e.revision||0)}</span></div></div><div class="card side-info"><h4>原報告書參考</h4><div class="form-hint">永續發展報告書第 ${esc(sec(a.section_id).source_page||'?')} 頁起</div><button class="btn sm primary" style="margin-top:10px" data-action="viewReference" data-page="${esc(sec(a.section_id).source_page||'1')}">開啟 PDF</button></div>${previous}${history}</aside></div>`;
}
function assignmentsView(){const secs=sections(),tas=listTasks();return '<div class="card pad"><div class="section-head"><h3>全部重大議題責任分工</h3><div class="btnrow"><button class="btn sm" data-action="newTopic">+ 新增重大議題</button><button class="btn primary sm" data-action="newYear">+ 新增年度</button></div></div><div class="mini-note" style="margin-bottom:20px">初始單位對應係依 2024 年永續報告書及業務性質建立的建議分工，並非已正式核定的權責表。正式上線前請管理者逐項確認。</div>'+secs.map(s=>{const assigned=tas.filter(t=>t.section_id===s.section_id),due=assigned[0]?assigned[0].due_date:'';return '<div class="chapter-card"><div><h4>'+reportCodeChip(s)+'　'+esc(s.section_title)+'</h4><p>'+esc(reportFacetLabel(s))+'　/　'+(assigned.length?assigned.map(t=>'<span class="tag">'+esc(uName(t.unit_id))+'</span>').join(''):'<span style="color:#a85959">尚未指派</span>')+'　'+(due?' 截止 '+esc(due):'')+'</p></div><button class="btn sm" data-action="editAssign" data-sec="'+esc(s.section_id)+'">設定權責</button></div>';}).join('')+'</div>';}

 return `<div class="dashboard-grid"><div class="card pad"><h3>產製重大議題追蹤彙整稿</h3><p class="page-subtitle">僅彙整 12 項重大議題及單位提供的追蹤內容，不含整份永續報告書其餘章節。</p><div class="mini-note" style="margin:18px 0">已鎖定 ${n.completed} / ${n.total} 筆；填報中 ${n.draft} 筆；未填報 ${n.none} 筆。</div><div class="btnrow"><button class="btn" data-action="downloadData">下載全校 CSV</button><button class="btn dark" data-action="genDraft">彙整全部現有資料</button><button class="btn primary" data-action="genComplete">只彙整已鎖定資料</button></div></div><div class="card pad"><h3>產製原則</h3><div class="ringdetail" style="margin-top:16px"><div>✓ 同一議題多單位分開呈現</div><div>✓ 保留 KPI 原始文字/數值</div><div>✓ 輸出可編輯 Google 文件及 PDF</div><div>✓ 不經審核，依各單位自行鎖定的狀態彙整</div></div></div></div>${S.lastResult?`<div class="card pad" style="margin-bottom:20px"><h3>本次產製結果</h3>${S.lastResult.doc_url?`<a href="${esc(safeUrl(S.lastResult.doc_url))}" target="_blank" rel="noopener">Google 文件</a>　<a href="${esc(safeUrl(S.lastResult.pdf_url))}" target="_blank" rel="noopener">PDF</a>`:esc(S.lastResult.message||'預覽不產生正式檔案')}<p>收錄 ${esc(S.lastResult.included_count)} 筆，仍待補 ${esc(S.lastResult.missing_count)} 項</p></div>`:''}<div class="card table-card"><div class="filters"><h3>歷次產製紀錄</h3></div><div class="table-scroll"><table class="data"><thead><tr><th>時間</th><th>模式</th><th>待補議題</th><th>文件</th></tr></thead><tbody>${recent.length?recent.map(r=>`<tr><td>${esc(r.at)}</td><td>${r.mode==='completed_only'?'已鎖定資料':'全部現有資料'}</td><td>${esc(r.missing_count)}</td><td><a href="${esc(safeUrl(r.doc_url))}" target="_blank">文件</a> / <a href="${esc(safeUrl(r.pdf_url))}" target="_blank">PDF</a></td></tr>`).join(''):'<tr><td colspan="4">尚無產製紀錄</td></tr>'}</tbody></table></div></div>`;

function referenceView(){
 const r=S.boot.reference_pdf||{},canOpen=DEMO||r.ready;
 const upload=admin()?`<div class="card pad" style="margin-top:22px"><div class="section-head"><h3>管理者 / 上傳或更新參考報告書 PDF</h3><span class="status draft">僅管理者</span></div><p class="page-subtitle">選擇 PDF 檔案，點選上傳後才會取代系統目前引用的版本（舊版檔案保留於管理者 Drive）。</p><div class="btnrow" style="margin-top:17px;align-items:center"><input id="referencePdfFile" class="input" type="file" accept=".pdf,application/pdf" style="max-width:430px"><button class="btn primary" data-action="uploadReference">上傳 / 更新 PDF</button></div><p class="form-hint">限 PDF，最大 15 MB。${DEMO?'目前是預覽模式：可選取檔案體驗操作，但無法實際上傳或儲存至學校 Drive。':'正式模式：成功上傳後所有已授權單位皆可在網站查看及下載。'}</p></div>`:'';

 else if(m.type==='office'){const unit=units().find(x=>x.unit_id===m.unit)||{};title='單位公務信箱授權｜'+(unit.name||'');body=`<div class="field"><label class="form-label">填報公務信箱（編輯/下載）</label><input id="officeEmail" type="email" class="input" placeholder="office@nkust.edu.tw" value="${esc(unit.office_email||'')}"></div><div class="field"><label class="form-label">檢視公務信箱（僅檢視/下載，可留空）</label><input id="viewerEmail" type="email" class="input" placeholder="viewer@nkust.edu.tw" value="${esc(unit.viewer_email||'')}"></div><div class="mini-note">可使用有群組收件功能的 @nkust.edu.tw 辦公室信箱，登入時寄送一次性驗證碼；群組信箱不需為可獨立登入 Google 的帳號。填報與唯讀不可共用同一信箱，也不可跨單位重複綁定。填報帳號本身也有檢視權，若不需要額外唯讀帳號，第二欄留白即可。</div>`;footer='<button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="saveOffice">儲存權限</button>';}
 else if(m.type==='user'){const u=m.user||{};title=m.user?'編輯管理者':'新增管理者';body='<div class="grid2"><div class="field"><label class="form-label">顯示名稱</label><input id="userName" class="input" value="'+esc(u.name||'')+'"></div><div class="field"><label class="form-label">學校帳號 Email</label><input id="userEmail" class="input" type="email" value="'+esc(u.email||'')+'" '+(m.user?'disabled':'')+' placeholder="admin@nkust.edu.tw"></div><div class="field"><label class="form-label">所屬單位</label><select id="userUnit" class="select">'+units().map(x=>'<option value="'+esc(x.unit_id)+'" '+((u.unit_id||'U01')===x.unit_id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div></div><select id="userRole" hidden><option value="admin" selected>系統管理者</option></select><label class="checkitem"><input type="checkbox" id="userActive" '+(u.active===false?'':'checked')+'> 啟用帳號</label>';footer='<button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="saveUser">儲存</button>';}
 else if(m.type==='topic'){title='新增重大永續議題';body='<div class="field"><label class="form-label">議題名稱</label><input id="newTopicName" class="input" placeholder="例如：新增重大永續議題"></div><div class="grid2"><div class="field"><label class="form-label">ESG 面向</label><select id="newTopicArea" class="select"><option value="E">E / 環境</option><option value="S">S / 社會</option><option value="G">G / 治理</option></select></div><div class="field"><label class="form-label">參考 PDF 頁碼（可留空）</label><input id="newTopicPage" class="input" type="number" min="1" max="136"></div></div><div class="form-hint">新增後請由管理者於重大議題權責指派畫面設定單位。建議僅在正式鑑別結果調整後使用。</div>';footer='<button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="saveTopic">新增議題</button>';}
 else if(m.type==='unit'){title='新增填報單位';body='<label class="form-label">單位名稱</label><input id="newUnitName" class="input" placeholder="例如：某某中心"><div class="form-hint" style="margin-top:12px">新增單位後，仍須由管理者進入「議題與權責指派」安排填報項目。</div>';footer='<button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="saveUnit">新增單位</button>';}
 else if(m.type==='unlock'){title='解鎖重大議題填報內容';body='<p class="page-subtitle">解鎖碼已寄至 '+esc(S.boot.me.email)+'，請於 10 分鐘內輸入 6 位數驗證碼。'+(DEMO?'（預覽碼：123456）':'')+'</p><div class="field" style="margin-top:20px"><label class="form-label">解鎖驗證碼</label><input class="input" id="unlockCode" inputmode="numeric" maxlength="6" placeholder="6 位數驗證碼"></div>';footer='<button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="confirmUnlock">驗證並解鎖</button>';}
 else if(m.type==='year'){title='建立新的報告年度';body='<div class="grid2"><div class="field"><label class="form-label">新年度</label><input class="input" type="number" id="newYear" min="2020" max="2099" value="'+(Math.max(...S.boot.years.map(Number))+1)+'"></div><div class="field"><label class="form-label">參考來源年度</label><select class="select" id="copyYear">'+S.boot.years.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div></div><label class="checkitem"><input id="copyAssign" type="checkbox" checked> 複製來源年度的議題指派（不複製填報數據與成果）</label>';footer='<button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="saveYear">建立年度</button>';}
 $('modalRoot').innerHTML='<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h3>'+esc(title)+'</h3><button class="btn sm" data-action="closeModal">✕</button></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+footer+'</div></div></div>';
}
function collectForm(options={}){const d=S.detail,a=d.assignment;return {year:S.year,section_id:a.section_id,unit_id:a.unit_id,base_revision:Number((d.entry||{}).revision||0),complete:!!options.complete,reopen:!!options.reopen,...Object.fromEntries(FIELDS.map(k=>[k,$('f_'+k)?$('f_'+k).value:'']))};}
async function saveDraft(silent){if(!S.detail||!S.detail.canEdit)return;clearTimeout(S.autosave);if(S.busy){if(!silent)toast('前一項作業尚未結束。');return;}const form=collectForm();S.busy=true;if($('saveState'))$('saveState').textContent='儲存中...';try{const result=await api('saveEntry',form);S.dirty=false;S.detail.entry={...(S.detail.entry||{}),...form,status:result.status,updated_at:result.updated_at,revision:result.revision};if($('saveState'))$('saveState').textContent='最後更新：'+result.updated_at;if(!silent)toast('內容已儲存。');}catch(e){if($('saveState'))$('saveState').textContent='儲存失敗';toast(e.message,true);}finally{S.busy=false;}}
async function changeComplete(reopen){if(!S.detail||!S.detail.canEdit||S.busy)return;clearTimeout(S.autosave);if(!confirm(reopen?'將本項改回「填報中」？':'確認將本項標記為「已完成」？鎖定後必須再次驗證公務信箱才能修改。'))return;S.busy=true;try{await api('saveEntry',collectForm(reopen?{reopen:true}:{complete:true}));S.dirty=false;S.detail=null;await refresh();S.view='tasks';render();toast(reopen?'已改為填報中。':'已儲存並鎖定。');}catch(e){toast(e.message,true);}finally{S.busy=false;}}

async function openTask(secId,unitId){S.view='detail';S.detail=null;render();try{S.detail=await api('getTask',{year:S.year,section_id:secId,unit_id:unitId});render();}catch(e){toast(e.message,true);S.view='tasks';render();}}
function downloadBlob(blob,filename){
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);
}
async function downloadData(){
 if(S.busy)return;
 if(S.dirty&&S.view==='detail'){await saveDraft(true);if(S.dirty){toast('請先確認草稿儲存完成，再下載資料。',true);return;}}
 S.busy=true;
 try{const r=await api('exportEntriesCsv',{year:S.year});downloadBlob(new Blob([r.csv],{type:'text/csv;charset=utf-8'}),r.file_name);toast('已準備 '+r.row_count+' 筆填報資料供下載。');}
 catch(e){toast(e.message,true);}finally{S.busy=false;}
}
function pdfBlob(base64){const decoded=atob(base64);const bytes=new Uint8Array(decoded.length);for(let i=0;i<decoded.length;i++)bytes[i]=decoded.charCodeAt(i);return new Blob([bytes],{type:'application/pdf'});}
async function useReferencePdf(download,page){
 if(DEMO){const path='./線上永續報告書.pdf'+(download?'':'#page='+String(page||1));if(download){const a=document.createElement('a');a.href=path;a.download='線上永續報告書.pdf';document.body.appendChild(a);a.click();a.remove();}else window.open(path,'_blank','noopener');return;}
 if(S.busy)return;
 const popup=download?null:window.open('about:blank','_blank');
 if(popup)try{popup.document.write('<title>載入參考 PDF</title><p style="font:16px sans-serif;padding:30px">正在開啟參考報告書…</p>');}catch(_){}
 S.busy=true;
 try{const r=await api('getReferencePdfData');const b=pdfBlob(r.base64);if(download){downloadBlob(b,r.file_name||'線上永續報告書.pdf');toast('參考 PDF 已開始下載。');}
 else{const url=URL.createObjectURL(b)+'#page='+String(page||1);if(popup)popup.location.href=url;else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();toast('如未開啟 PDF，請允許瀏覽器開啟新分頁。');}setTimeout(()=>URL.revokeObjectURL(url.split('#')[0]),300000);}}
 catch(e){if(popup)popup.close();toast(e.message,true);}finally{S.busy=false;}
}
async function uploadReference(){
 if(!admin()){toast('只有系統管理者可以上傳 PDF。',true);return;}
 const file=($('referencePdfFile')||{}).files?.[0];if(!file){toast('請先選擇 PDF 檔案。',true);return;}
 if(file.size>15*1024*1024||file.size<8||(!file.name.toLowerCase().endsWith('.pdf')&&file.type!=='application/pdf')){toast('僅接受 15 MB 以內的 PDF。',true);return;}
 if(DEMO){toast('已選取「'+file.name+'」。這是互動預覽，無法實際上傳；正式部署後可使用此按鈕更新。');return;}
 if(!confirm('確定以「'+file.name+'」更新全校填報系統的參考 PDF？'))return;
 if(S.busy)return;S.busy=true;
 try{const b64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('檔案讀取失敗。'));reader.readAsDataURL(file);});const result=await api('uploadReferencePdf',{file_name:file.name,base64:b64});await refresh();S.view='reference';render();toast('已更新參考 PDF：'+result.name);}
 catch(e){toast('上傳失敗：'+e.message,true);}finally{S.busy=false;}
}
async function requestUnlock(){
 if(!S.detail||!S.detail.canUnlock)return;
 const a=S.detail.assignment;
 try{await api('requestEmailCode',{purpose:'unlock',year:a.year,section_id:a.section_id,unit_id:a.unit_id});S.modal={type:'unlock'};renderModal();}catch(e){toast(e.message,true);}
}
async function confirmUnlock(){
 if(!S.detail||!S.modal||S.modal.type!=='unlock')return;
 const a=S.detail.assignment,code=String(($('unlockCode')||{}).value||'').trim();
 try{await api('verifyUnlockCode',{year:a.year,section_id:a.section_id,unit_id:a.unit_id,code});S.modal=null;S.detail=await api('getTask',{year:a.year,section_id:a.section_id,unit_id:a.unit_id});render();toast('已解鎖，可以繼續編輯。');}catch(e){toast(e.message,true);}
}
async function action(name,el){if(name==='logout')return logOut();if(name==='sendLoginCode')return sendLoginCode();if(name==='confirmLogin')return confirmLogin();if(name==='backLogin'){S.loginStep='email';renderLogin();return;}if(name==='requestUnlock')return requestUnlock();if(name==='confirmUnlock')return confirmUnlock();if(name==='downloadData')return downloadData();if(name==='viewReference')return useReferencePdf(false,Number(el.dataset.page||1));if(name==='downloadReference')return useReferencePdf(true,1);if(name==='uploadReference')return uploadReference();if(name==='openTask')return openTask(el.dataset.sec,el.dataset.unit);if(name==='closeModal'){S.modal=null;renderModal();return;}if(name==='saveDraft')return saveDraft(false);if(name==='markComplete')return changeComplete(false);if(name==='editAssign'){S.modal={type:'assign',sec:el.dataset.sec};renderModal();return;}if(name==='editOffice'){S.modal={type:'office',unit:el.dataset.unit};renderModal();return;}if(name==='newUser'){S.modal={type:'user'};renderModal();return;}if(name==='editUser'){S.modal={type:'user',user:(S.boot.users||[]).find(u=>u.email===el.dataset.email)};renderModal();return;}if(name==='newUnit'){S.modal={type:'unit'};renderModal();return;}if(name==='newTopic'){S.modal={type:'topic'};renderModal();return;}if(name==='newYear'){S.modal={type:'year'};renderModal();return;}
 if(name==='saveAssign'){const unit_ids=[...document.querySelectorAll('.assignUnit:checked')].map(x=>x.value);try{await api('saveSectionAssignments',{year:S.year,section_id:S.modal.sec,unit_ids,due_date:$('assignDue').value});S.modal=null;await refresh();toast('議題權責已更新。');}catch(e){toast(e.message,true);}return;}
 if(name==='saveOffice'){try{const office_email=$('officeEmail').value.trim();await api('setUnitOfficeEmail',{unit_id:S.modal.unit,office_email,viewer_email:$('viewerEmail').value.trim()});S.modal=null;await refresh();toast(office_email?'已更新單位公務信箱授權。':'已撤銷單位公務信箱授權。');}catch(e){toast(e.message,true);}return;}
 if(name==='saveUser'){const u=S.modal.user||{};const data={email:u.email||$('userEmail').value,name:$('userName').value,unit_id:$('userUnit').value,role:$('userRole').value,active:$('userActive').checked};try{await api('upsertUser',data);S.modal=null;await refresh();toast('帳號權限已儲存。');}catch(e){toast(e.message,true);}return;}
 if(name==='saveTopic'){try{await api('addMaterialTopic',{name:$('newTopicName').value,area:$('newTopicArea').value,source_page:$('newTopicPage').value});S.modal=null;await refresh();toast('重大議題已新增，請繼續設定權責單位。');}catch(e){toast(e.message,true);}return;}
 if(name==='saveUnit'){try{await api('addUnit',{name:$('newUnitName').value});S.modal=null;await refresh();toast('已新增單位。');}catch(e){toast(e.message,true);}return;}
 if(name==='saveYear'){const newYear=$('newYear').value;try{await api('createReportYear',{year:newYear,copy_from:$('copyYear').value,copy_assignments:$('copyAssign').checked});S.modal=null;S.year=newYear;await refresh();toast('已建立新的填報年度。');}catch(e){toast(e.message,true);}return;}
 if(name==='genDraft'||name==='genComplete'){if(S.busy)return;const completed_only=name==='genComplete';if(!confirm('即將依目前填報資料建立新的重大議題追蹤彙整稿，是否繼續？'))return;S.busy=true;toast('正在建立彙整文件，請勿重複按下按鈕。');try{S.lastResult=await api('generateReport',{year:S.year,completed_only});await refresh();S.view='report';render();toast('重大議題追蹤彙整完成。');}catch(e){toast(e.message,true);}finally{S.busy=false;}return;}
}
document.addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.view){if(S.dirty&&S.view==='detail')await saveDraft(true);S.view=btn.dataset.view;S.filter='all';S.chapter='all';S.query='';S.detail=null;render();return;}if(btn.dataset.action){e.preventDefault();await action(btn.dataset.action,btn);}});
document.addEventListener('input',e=>{if(e.target.matches('[data-autosave]')){S.dirty=true;if($('saveState'))$('saveState').textContent='尚有未儲存的修改...';clearTimeout(S.autosave);S.autosave=setTimeout(()=>saveDraft(true),2000);}});
document.addEventListener('change',async e=>{if(e.target.id==='yearChooser'){if(S.dirty&&S.view==='detail')await saveDraft(true);S.year=e.target.value;S.view='dashboard';S.detail=null;S.filter='all';S.chapter='all';S.query='';render();}if(e.target.id==='statusFilter'){S.filter=e.target.value;render();}if(e.target.id==='chapterFilter'){S.chapter=e.target.value;render();}if(e.target.id==='demoIdentity'){S.demoRole=e.target.value;await refresh();}if(e.target.id==='demoUnit'){S.demoUnit=e.target.value;await refresh();}});
document.addEventListener('input',e=>{if(e.target.id==='taskQuery'){const start=e.target.selectionStart;S.query=e.target.value;const rows=allTasks();const tbody=document.querySelector('table.data tbody');if(tbody){tbody.innerHTML=rows.map(t=>'<tr><td>'+reportCodeChip(t.section)+'</td><td><strong>'+esc(t.section.section_title)+'</strong><div class="smallgrey">'+esc(reportFacetLabel(t.section))+'</div></td><td>'+esc(uName(t.unit_id))+'</td><td>'+status(t.status)+'</td><td>'+esc(t.due_date||'未設定')+'</td><td>'+esc(t.entry&&t.entry.updated_at||'尚無更新')+'</td><td><button class="btn sm soft" data-action="openTask" data-sec="'+esc(t.section_id)+'" data-unit="'+esc(t.unit_id)+'">開啟</button></td></tr>').join('')||'<tr><td colspan="7">沒有符合條件的資料</td></tr>';}}});
